name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Verify Uploaded Resources
        run: |
          cd ./app/Madeira
          echo "=== Arquivos na pasta Madeira ==="
          ls -la

      - name: Build App & Package IPA
        run: |
          cd ./app

          xcodebuild -resolvePackageDependencies

          xcodebuild clean build \
            -scheme "Madeira" \
            -derivedDataPath build \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            HEADER_SEARCH_PATHS="$(PWD) $(PWD)/Madeira $(PWD)/Madeira/**" \
            USER_HEADER_SEARCH_PATHS="$(PWD) $(PWD)/Madeira" \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            WARNING_CFLAGS="-w" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_SWIFT_FLAGS="-suppress-warnings -cxx-interoperability-mode=default" 2>&1 | tee xcodebuild.log || true

          if [ -d "build/Build/Products/Release-iphoneos/Madeira.app" ]; then
            cd build/Build/Products/Release-iphoneos
            mkdir -p Payload
            cp -R *.app Payload/
            zip -r Madeira.ipa Payload
          else
            echo "================ MOTIVO EXATO DO ERRO NO C++ / HEADER ================"
            grep -i -C 3 "error:" xcodebuild.log || tail -n 60 xcodebuild.log
            echo "======================================================================="
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Madeira-IPA
          path: app/build/Build/Products/Release-iphoneos/Madeira.ipa
