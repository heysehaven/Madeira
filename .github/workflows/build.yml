name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Find Project Directory & Build
        run: |
          # Procura onde esta o arquivo do projeto (.xcodeproj ou .xcworkspace)
          PROJ_PATH=$(find . -maxdepth 3 -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          
          if [ -z "$PROJ_PATH" ]; then
            echo "Erro: Nenhum projeto Xcode encontrado no repositório."
            exit 1
          fi
          
          PROJ_DIR=$(dirname "$PROJ_PATH")
          echo "Projeto encontrado na pasta: $PROJ_DIR"
          cd "$PROJ_DIR"

          # Resolve dependencias
          xcodebuild -resolvePackageDependencies

          # Detecta o Scheme automaticamente
          SCHEME_NAME=$(xcodebuild -list -json | grep -A 10 '"schemes"' | grep '"' | head -n 1 | tr -d '", ')
          echo "Scheme detectado: $SCHEME_NAME"

          # Compila o projeto
          xcodebuild build \
            -scheme "$SCHEME_NAME" \
            -derivedDataPath build \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          # Empacota em .ipa
          cd build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R *.app Payload/
          zip -r Madeira.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Madeira-IPA
          path: "**/build/Build/Products/Release-iphoneos/Madeira.ipa"
