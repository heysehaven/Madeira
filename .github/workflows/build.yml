name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Fix Missing Build Resources
        run: |
          cd ./app
          # Garante que os arquivos/diretórios de recursos esperados existam
          mkdir -p Madeira
          if [ ! -f "Madeira/x86_64-vcruntime" ] && [ ! -d "Madeira/x86_64-vcruntime" ]; then
            echo "Criando placeholder para x86_64-vcruntime"
            mkdir -p Madeira/x86_64-vcruntime
          fi
          if [ ! -f "Madeira/prefix-template.tar.gz" ]; then
            echo "Criando placeholder para prefix-template.tar.gz"
            touch Madeira/prefix-template.tar.gz
          fi

      - name: Build App & Package IPA
        run: |
          cd ./app

          # Resolve dependencias do Swift Package Manager
          xcodebuild -resolvePackageDependencies

          # Compila o projeto Madeira para iOS
          xcodebuild build \
            -scheme "Madeira" \
            -derivedDataPath build \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          # Empacota a pasta .app compilada dentro de um .ipa
          cd build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R *.app Payload/
          zip -r Madeira.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Madeira-IPA
          path: app/build/Build/Products/Release-iphoneos/Madeira.ipa
