name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Debug - Find FEXCore
        run: |
          echo "=== Procurando FEXCore no repo ==="
          find . -iname "*FEXCore*" -not -path "*/.git/*" 2>/dev/null
          echo "=== Procurando Config.h ==="
          find . -iname "Config.h" -not -path "*/.git/*" 2>/dev/null
          echo "=== Submódulos declarados ==="
          cat .gitmodules 2>/dev/null || echo "Sem .gitmodules"
          echo "=== Packages resolvidos pelo SPM ==="
          find . -iname "Package.resolved" -exec cat {} \; 2>/dev/null

      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: List available Xcode versions (debug)
        run: ls /Applications | grep Xcode

      - name: Verify Uploaded Resources
        run: |
          cd ./app/Madeira
          echo "=== Arquivos na pasta Madeira ==="
          ls -la

      - name: Build App (Archive)
        run: |
          cd ./app

          xcodebuild -resolvePackageDependencies

          xcodebuild archive \
            -scheme "Madeira" \
            -archivePath build/Madeira.xcarchive \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            CLANG_CXX_LANGUAGE_STANDARD="gnu++17" \
            CLANG_CXX_LIBRARY="libc++" \
            HEADER_SEARCH_PATHS="$(PWD)/Madeira $(PWD)/Madeira/**" \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            WARNING_CFLAGS="-w" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_SWIFT_FLAGS="-suppress-warnings" 2>&1 | tee xcodebuild.log || true

          if [ -d "build/Madeira.xcarchive/Products/Applications/Madeira.app" ]; then
            echo "Archive concluído com sucesso!"
          else
            echo "================ ERRO EXATO DA FALHA NA COMPILAÇÃO ================"
            grep -i -C 3 "error:" xcodebuild.log || tail -n 80 xcodebuild.log
            echo "==================================================================="
            exit 1
          fi

      - name: Fix Executable Permissions & Package IPA
        run: |
          cd app/build/Madeira.xcarchive/Products/Applications

          chmod -R 755 Madeira.app/
          find Madeira.app -type f -exec chmod +x {} +

          rm -rf Madeira.app/_CodeSignature

          export COPYFILE_DISABLE=1
          mkdir -p Payload
          cp -R Madeira.app Payload/
          find Payload -name "._*" -delete

          zip -r -y Madeira.ipa Payload

          echo "=== Tamanho do IPA gerado ==="
          du -h Madeira.ipa

          echo "=== Conteúdo do IPA (checagem de frameworks embutidos) ==="
          unzip -l Madeira.ipa | grep -i framework || echo "Nenhum framework encontrado - verifique se é esperado"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Madeira-IPA
          path: app/build/Madeira.xcarchive/Products/Applications/Madeira.ipa
