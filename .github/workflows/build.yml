      - name: Gerar ConfigValues.inl / ConfigOptions.inl (multi-estratégia + diagnóstico)
        run: |
          set +e  # não mata o job, queremos ver todos os diagnósticos

          echo "############################################"
          echo "### 1) Conteúdo do config_generator.py"
          echo "############################################"
          find FEX -iname "config_generator.py" -exec echo "Encontrado em: {}" \; -exec cat {} \;

          echo "############################################"
          echo "### 2) Trecho do CMakeLists.txt que gera os .inl"
          echo "############################################"
          grep -rn -B5 -A15 "ConfigValues.inl\|ConfigOptions.inl" FEX/FEXCore/Source/CMakeLists.txt FEX/FEXCore/CMakeLists.txt FEX/CMakeLists.txt 2>/dev/null

          echo "############################################"
          echo "### 3) Tentativa: configurar CMake do FEX (host)"
          echo "############################################"
          mkdir -p fex-gen-build
          cmake -S FEX -B fex-gen-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=False \
            -DENABLE_ASSERTIONS=False 2>&1 | tail -n 100

          echo "############################################"
          echo "### 4) Tentativa: rodar ninja e listar o que foi gerado"
          echo "############################################"
          (cd fex-gen-build && ninja -k 0 2>&1 | tail -n 150)
          find fex-gen-build -iname "ConfigValues.inl" -o -iname "ConfigOptions.inl"

          echo "############################################"
          echo "### 5) Build Phases do projeto Xcode relacionadas a Config"
          echo "############################################"
          grep -n -B3 -A15 "ConfigValues\|config_generator\|shellScript" app/Madeira.xcodeproj/project.pbxproj | grep -i -B10 -A5 "config" 

          echo "############################################"
          echo "### FIM DO DIAGNOSTICO - job continua normalmente ###"
          echo "############################################"
