name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Clean & Fix Missing Build Resources
        run: |
          cd ./app
          mkdir -p Madeira
          
          # Se x86_64-vcruntime for um diretório (criado anteriormente), remove
          if [ -d "Madeira/x86_64-vcruntime" ]; then
            rm -rf Madeira/x86_64-vcruntime
          fi
          
          # Cria os arquivos vazios (placeholders) que o Xcode exige no bundle
          if [ ! -f "Madeira/x86_64-vcruntime" ]; then
            echo "Criando arquivo placeholder para x86_64-vcruntime"
            touch Madeira/x86_64-vcruntime
          fi
          
          if [ ! -f "Madeira/prefix-template.tar.gz" ]; then
            echo "Criando arquivo placeholder para prefix-template.tar.gz"
            touch Madeira/prefix-template.tar.gz
          fi

      - name: Build App & Package IPA
        run: |
          cd ./app

          xcodebuild -resolvePackageDependencies

          xcodebuild build \
            -scheme "Madeira" \
            -derivedDataPath build \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            HEADER_SEARCH_PATHS="$(PWD)/Madeira $(PWD)/Madeira/**" \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            WARNING_CFLAGS="-w" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_SWIFT_FLAGS="-suppress-warnings"

          cd build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R *.app Payload/
          zip -r Madeira.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Madeira-IPA
          path: app/build/Build/Products/Release-iphoneos/Madeira.ipa
