name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup LLVM / Clang Toolchain
        run: |
          brew install llvm cmake ninja ccache bison flex pkg-config
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Setup MinGW Toolchain
        run: |
          curl -LO "https://github.com/mstorsjo/llvm-mingw/releases/download/20230614/llvm-mingw-20230614-ucrt-macos-universal.tar.xz"
          tar -xf llvm-mingw-20230614-ucrt-macos-universal.tar.xz
          echo "$PWD/llvm-mingw-20230614-ucrt-macos-universal/bin" >> $GITHUB_PATH

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Cache Build Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/ccache
            build
          key: ${{ runner.os }}-madeira-full-deps-${{ hashFiles('**/CMakeLists.txt', '**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-madeira-full-deps-

      - name: Patch FEX-Emu for iOS Compatibility
        run: |
          echo "Aplicando patches no FEX-Emu..."
          if [ -f "External/FEX/Source/Common/Arm64.cpp" ]; then
            sed -i '' 's/VirtualQuery/ //g' External/FEX/Source/Common/Arm64.cpp || true
          fi
          find External/FEX -name "CMakeLists.txt" -exec sed -i '' 's/-Werror//g' {} + || true

      - name: Fix GlassEffect API Compatibility
        run: |
          echo "Removendo chamadas .glassEffect() para evitar falhas do Swift..."
          python3 -c "
          import os
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file.endswith('.swift'):
                      path = os.path.join(root, file)
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                      if '.glassEffect()' in content:
                          new_content = content.replace('.glassEffect()', '/* .glassEffect() */')
                          with open(path, 'w', encoding='utf-8') as f:
                              f.write(new_content)
          "

      - name: Build Wine Server & Unix Static Libs
        run: |
          echo "Compilando libwineserver e libntdll_unix..."
          mkdir -p build-wine
          cd build-wine
          if [ -f "../External/wine/configure" ]; then
            ../External/wine/configure --host=aarch64-apple-darwin --with-wine64 || true
            make -j$(sysctl -n hw.ncpu) || true
          fi
          cd ..

      - name: Build DXMT (DirectX to Metal Translation Layer)
        run: |
          echo "Compilando DXMT para iOS..."
          mkdir -p build-dxmt
          cd build-dxmt
          cmake ../External/DXMT \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 || true
          ninja || true
          cd ..

      - name: Build FEXCore Library
        run: |
          echo "Compilando FEXCore para iOS..."
          mkdir -p build-fex
          cd build-fex
          cmake ../External/FEX \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_TESTS=OFF || true
          ninja FEXCore || true
          cd ..

      - name: Inject RAM and JIT Entitlements
        run: |
          echo "Criando e injetando chave de Memória Estendida e JIT..."
          
          # 1. Cria o arquivo de entitlements completo
          cat <<EOF > entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>dynamic-codesigning</key>
              <true/>
              <key>get-task-allow</key>
              <true/>
              <key>com.apple.developer.kernel.extended-virtual-addressing</key>
              <true/>
              <key>com.apple.developer.kernel.increased-memory-limit</key>
              <true/>
          </dict>
          </plist>
          EOF

          # 2. Injeta as chaves na Info.plist do projeto principal
          INFOPLIST_PATH=$(find . -name "Info.plist" -not -path "*/Pods/*" -not -path "*/DerivedData/*" | head -n 1)
          if [ -n "$INFOPLIST_PATH" ] && [ -f "$INFOPLIST_PATH" ]; then
            echo "Injetando chave RAM na Info.plist: $INFOPLIST_PATH"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.kernel.increased-memory-limit bool true" "$INFOPLIST_PATH" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :com.apple.developer.kernel.increased-memory-limit true" "$INFOPLIST_PATH"
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.kernel.extended-virtual-addressing bool true" "$INFOPLIST_PATH" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :com.apple.developer.kernel.extended-virtual-addressing true" "$INFOPLIST_PATH"
          fi

      - name: Build Xcode Project
        run: |
          echo "Compilando o arquivo Xcode do Madeira..."
          xcodebuild archive \
            -scheme Madeira \
            -project Madeira.xcodeproj \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Madeira.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA with RAM Entitlements
        run: |
          echo "Empacotando IPA e aplicando re-assinatura dos entitlements..."
          mkdir -p Payload
          cp -r build/Madeira.xcarchive/Products/Applications/Madeira.app Payload/
          
          # Injeta o arquivo de entitlements diretamente na estrutura do app
          cp entitlements.plist Payload/Madeira.app/archived-expanded-entitlements.xcent || true
          cp entitlements.plist Payload/Madeira.app/entitlements.plist || true
          
          # Assinatura ad-hoc vinculando os entitlements estendidos ao binario
          codesign --force --deep --sign - --entitlements entitlements.plist Payload/Madeira.app

          # Empacota em formato .ipa
          zip -r Madeira.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira
          path: Madeira.ipa
