name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Force-init nested submodules inside FEX (safety net)
        run: |
          cd FEX
          git submodule update --init --recursive
          cd ..

      # <<< AQUI, dentro da MESMA lista de steps, com o MESMO recuo (6 espaços antes do "-") >>>
      - name: Gerar ConfigValues.inl / ConfigOptions.inl (multi-estratégia + diagnóstico)
        run: |
          set +e
          ...

      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        ...
