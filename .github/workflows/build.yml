      - name: Build App (Archive)
        run: |
          cd ./app

          xcodebuild -resolvePackageDependencies

          xcodebuild archive \
            -scheme "Madeira" \
            -archivePath build/Madeira.xcarchive \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            CLANG_CXX_LANGUAGE_STANDARD="gnu++17" \
            CLANG_CXX_LIBRARY="libc++" \
            HEADER_SEARCH_PATHS="$(PWD)/Madeira $(PWD)/Madeira/**" \
            SYSTEM_HEADER_SEARCH_PATHS="$(PWD)/../FEX/FEXCore/include $(PWD)/../FEX/FEXCore/Source $(PWD)/../FEX/Source $(PWD)/../FEX/FEXHeaderUtils/include $(PWD)/../FEX/CodeEmitter/include $(PWD)/../FEX/External/fmt/include $(PWD)/../FEX/External/xxhash $(PWD)/../FEX/External/range-v3/include $(PWD)/../FEX/External/unordered_dense/include $(PWD)/../FEX/External/zydis/include $(PWD)/../FEX/External/Vulkan-Headers/include $(PWD)/../FEX/External/SoftFloat-3e $(PWD)/../FEX/External/tiny-json $(PWD)/../FEX/External/cephes $(PWD)/../FEX/External/drm-headers/include $(PWD)/../FEX/External/vixl/src" \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            WARNING_CFLAGS="-w" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_SWIFT_FLAGS="-suppress-warnings" 2>&1 | tee xcodebuild.log || true

          if [ -d "build/Madeira.xcarchive/Products/Applications/Madeira.app" ]; then
            echo "Archive concluído com sucesso!"
          else
            echo "================ ERRO EXATO DA FALHA NA COMPILAÇÃO ================"
            grep -i -C 3 "error:" xcodebuild.log || tail -n 80 xcodebuild.log
            echo "==================================================================="
            exit 1
          fi
