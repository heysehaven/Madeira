name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build App
        run: |
          cd ./app

          xcodebuild -resolvePackageDependencies

          xcodebuild clean build \
            -scheme "Madeira" \
            -derivedDataPath build \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            WARNING_CFLAGS="-w" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_SWIFT_FLAGS="-suppress-warnings -cxx-interoperability-mode=default"

      - name: Fix Permissions & Package IPA
        run: |
          cd app/build/Build/Products/Release-iphoneos
          
          # Garante permissões de execução para os binários internos
          chmod -R +x Madeira.app/
          find Madeira.app -type f -exec chmod +x {} +

          mkdir -p Payload
          cp -R Madeira.app Payload/

          # Remove assinaturas prévias corrompidas para permitir ad-hoc re-sign no instalador
          rm -rf Payload/Madeira.app/_CodeSignature

          # Zipa preservando os links e permissões POSIX
          zip -r -y Madeira.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Madeira-IPA
          path: app/build/Build/Products/Release-iphoneos/Madeira.ipa
