name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Resolve Swift Package Dependencies
        run: xcodebuild -resolvePackageDependencies

      - name: Build App (Auto-Detect Scheme)
        run: |
          SCHEME_NAME=$(xcodebuild -list -json | grep -A 10 '"schemes"' | grep '"' | head -n 1 | tr -d '", ')
          echo "Scheme encontrado: $SCHEME_NAME"
          xcodebuild build \
            -scheme "$SCHEME_NAME" \
            -derivedDataPath build \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          cd build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R *.app Payload/
          zip -r Madeira.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Madeira-IPA
          path: build/Build/Products/Release-iphoneos/Madeira.ipa
