name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Prepare Resources for Bridging Header
        run: |
          cd ./app
          
          # Remove limpo qualquer tentativa anterior
          rm -rf Madeira/x86_64-vcruntime
          
          # Cria x86_64-vcruntime como pasta com arquivo valido dentro para nao quebrar o PCH
          mkdir -p Madeira/x86_64-vcruntime
          echo "placeholder" > Madeira/x86_64-vcruntime/dummy.txt
          
          # Garante o prefix-template
          if [ ! -f "Madeira/prefix-template.tar.gz" ]; then
            touch Madeira/prefix-template.tar.gz
          fi

      - name: Build App & Capture Errors
        run: |
          cd ./app

          xcodebuild -resolvePackageDependencies

          # Roda o xcodebuild limpo para forçar a regeração do PCH (Bridging Header)
          xcodebuild clean build \
            -scheme "Madeira" \
            -derivedDataPath build \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            WARNING_CFLAGS="-w" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_SWIFT_FLAGS="-suppress-warnings" 2>&1 | tee xcodebuild.log || true

          # Se o .app foi gerado, empacota
          if [ -d "build/Build/Products/Release-iphoneos/Madeira.app" ]; then
            cd build/Build/Products/Release-iphoneos
            mkdir -p Payload
            cp -R *.app Payload/
            zip -r Madeira.ipa Payload
          else
            echo "================ MOTIVO REAL DA FALHA NO BRIDGING HEADER ================"
            grep -B 3 -A 10 "error:" xcodebuild.log | head -n 40
            echo "=========================================================================="
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Madeira-IPA
          path: app/build/Build/Products/Release-iphoneos/Madeira.ipa
