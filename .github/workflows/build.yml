name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Xcode version
      run: |
        sudo xcode-select -s /Applications/Xcode.app
        xcodebuild -version

    - name: Build placeholder instructions
      run: |
        echo "Ambiente macOS pronto. Aqui entram os scripts de build do Madeira."
        # Como o projeto possui scripts internos de compilação em build/, 
        # você pode apontar para eles caso queira testar a compilação inicial.
        ls -la
