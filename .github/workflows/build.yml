      - name: DEBUG - Inspecionar gerador de config do FEXCore
        run: |
          echo "=== Conteúdo do config_generator.py ==="
          cat FEX/FEXCore/Scripts/config_generator.py
          echo "=== --help do script ==="
          python3 FEX/FEXCore/Scripts/config_generator.py --help || true
          echo "=== Trecho do CMakeLists.txt que chama o gerador ==="
          grep -n -B3 -A10 "config_generator.py\|ConfigValues.inl\|ConfigOptions.inl" FEX/FEXCore/Source/CMakeLists.txt
